name: Label Release Please PR for Kokoro

# Kokoro runs the correctness-test presubmit only when a PR has the kokoro:run label. This adds the
# label to release PRs once Kokoro has started its other presubmits, so the label starts only
# correctness-test.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

# Least privilege at the workflow level; the job declares what it needs below.
permissions:
  contents: read

# Only the newest commit on a PR matters, so a run still waiting on an older one is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  label-release-pr:
    name: label-release-pr
    # Release PRs from this repo only (fork PRs get a read-only token), never -SNAPSHOT bump PRs,
    # and not when the label is already on the PR: Kokoro already reads it for this event.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'release-please--') &&
      !endsWith(github.event.pull_request.title, '-SNAPSHOT') &&
      !contains(github.event.pull_request.labels.*.name, 'kokoro:run')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pull-requests: write # add the label
      statuses: read # see which Kokoro presubmits have started
    env:
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      LABEL: kokoro:run
      CORRECTNESS_CONTEXT: presubmits / correctness-test
      # Presubmits Kokoro starts on its own for release PRs. kokoro:run skips a job only once the
      # job has a status on the commit, so adding the label earlier starts these a second time.
      AUTO_STARTED_CONTEXTS: |-
        presubmits / compilation
        presubmits / integration-tests
      WAIT_TIMEOUT_SECONDS: 1200
      POLL_INTERVAL_SECONDS: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Wait for Kokoro to start its own presubmits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t expected <<< "$AUTO_STARTED_CONTEXTS"
          deadline=$((SECONDS + WAIT_TIMEOUT_SECONDS))
          while true; do
            started=$(gh api "repos/$REPO/commits/$HEAD_SHA/status" --jq '.statuses[].context') \
              || started=""
            missing=()
            for context in "${expected[@]}"; do
              grep -qxF "$context" <<< "$started" || missing+=("$context")
            done
            if (( ${#missing[@]} == 0 )); then
              echo "Kokoro has started all of its own presubmits."
              exit 0
            fi
            waiting_for=$(printf '"%s", ' "${missing[@]}")
            waiting_for=${waiting_for%, }
            if (( SECONDS >= deadline )); then
              echo "::warning::Timed out waiting for ${waiting_for}; labeling anyway may start them twice."
              exit 0
            fi
            echo "Waiting for Kokoro to start ${waiting_for}"
            sleep "$POLL_INTERVAL_SECONDS"
          done

      - name: Check the label would still start correctness-test
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha')
          labels=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.labels[].name')
          contexts=$(gh api "repos/$REPO/commits/$HEAD_SHA/status" --jq '.statuses[].context')
          reason=""
          if [[ "$current_sha" != "$HEAD_SHA" ]]; then
            reason="the PR has a newer commit, and the run for that push handles it"
          elif grep -qxF "$LABEL" <<< "$labels"; then
            reason="$LABEL is already on the PR"
          elif grep -qxF "$CORRECTNESS_CONTEXT" <<< "$contexts"; then
            reason="correctness-test already ran on this commit"
          fi
          if [[ -n "$reason" ]]; then
            echo "::notice::Not adding $LABEL: $reason."
            echo "add-label=false" >> "$GITHUB_OUTPUT"
          else
            echo "add-label=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Add kokoro:run label
        if: steps.check.outputs.add-label == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$REPO/issues/$PR_NUMBER/labels" -f "labels[]=$LABEL" --silent
