# Test-only logging configuration.
#
# LoggingTelemetryReporter checks whether the configured level is enabled before building its
# message, so its tests need a binding that actually reports levels as enabled. The reporter's
# own logger is set to trace so that every LogLevel under test is exercised; everything else
# stays at warn to keep the test output readable.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.log.com.google.cloud.gcs.analyticscore.common.telemetry.LoggingTelemetryReporter=trace
